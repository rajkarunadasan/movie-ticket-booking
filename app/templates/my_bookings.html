{% extends "base.html" %}
{% block content %}
<h1>My Bookings</h1>
{% if bookings %}
<table>
  <thead><tr><th>Booking ID</th><th>Movie</th><th>Show time</th><th>Seats</th><th>Total</th></tr></thead>
  <tbody>
  {% for b in bookings %}
    <tr><td><a href="{{ url_for('booking.ticket', reference=b.reference) }}">{{ b.reference }}</a></td>
        <td>{{ b.title }}</td><td>{{ b.show_time }}</td><td>{{ b.seats }}</td><td>&#8377;{{ b.total }}</td></tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<div class="empty">You have no bookings yet.</div>
{% endif %}
{% endblock %}
