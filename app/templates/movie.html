{% extends "base.html" %}
{% block content %}
<h1>{{ movie.title }}</h1>
<p class="meta"><span class="badge">{{ movie.genre }}</span> <span class="badge">{{ movie.language }}</span> &middot; {{ movie.duration }} min</p>
<p>{{ movie.description }}</p>
<h2>Showtimes</h2>
<table>
  <thead><tr><th>Date &amp; time</th><th>Hall</th><th>Price</th><th></th></tr></thead>
  <tbody>
  {% for s in shows %}
    <tr><td>{{ s.show_time }}</td><td>{{ s.hall }}</td><td>&#8377;{{ s.price }}</td><td><a class="btn gold" href="{{ url_for('booking.seats', show_id=s.id) }}">Book seats</a></td></tr>
  {% endfor %}
  </tbody>
</table>
<!-- MOVIE_EXTRA -->
{% endblock %}
