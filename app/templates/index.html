{% extends "base.html" %}
{% block content %}
<h1>Now Showing</h1>
{% if movies %}
<div class="grid">
  {% for m in movies %}
  <div class="card">
    <div class="poster">{{ m.title }}</div>
    <h3>{{ m.title }}</h3>
    <p class="meta"><span class="badge">{{ m.genre }}</span> <span class="badge">{{ m.language }}</span> &middot; {{ m.duration }} min</p>
    <a class="btn" href="{{ url_for('movies.detail', movie_id=m.id) }}">Details &amp; Showtimes</a>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty">No movies found.</div>
{% endif %}
{% endblock %}
